name: 部署站点

# Pages 已切换为 Actions 部署，代码改动推送到 main 后由本工作流发布。
# 定时任务自己提交的数据变更由 update-metro.yml 直接部署（机器人推送不会触发本工作流）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 收集站点文件
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude=./.git --exclude=./.github --exclude=./timetable -cf - . | tar -xf - -C "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
          # 每次尝试用不同产物名：重跑（attempt>=2）时，旧的同名产物不会导致部署失败
          name: github-pages-${{ github.run_attempt }}

      # GitHub 的产物元数据接口有延迟：deploy-pages 通过 Actions 产物服务（Twirp）查询，
      # 刚上传完立刻查询可能返回 0 个产物，导致部署失败。这里先轮询 REST 接口，
      # 再轮询 deploy-pages 实际使用的产物服务，等产物真正可见后再部署。
      - name: 等待 Pages 产物可查询
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="github-pages-${{ github.run_attempt }}"
          for i in $(seq 1 45); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=$name" --jq '.artifacts | length' 2>/dev/null || echo 0)
            if [ "$n" -gt 0 ]; then
              echo "REST: 产物 $name 已可见（第 $i 次查询）"
              break
            fi
            sleep 2
          done
          ok=0
          for i in $(seq 1 30); do
            body=$(curl -sS --max-time 5 -X POST "$ACTIONS_RESULTS_URL/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts" -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" -H 'Content-Type: application/json' -d '{}' 2>/dev/null || true)
            if [ -n "$body" ]; then
              ok=1
              n=$(printf '%s' "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for a in d.get('artifacts',[]) if a.get('name')==sys.argv[1]))" "$name" 2>/dev/null || echo 0)
              if [ "${n:-0}" -gt 0 ]; then
                echo "产物服务: $name 已可见（第 $i 次查询）"
                exit 0
              fi
            fi
            sleep 2
          done
          if [ "$ok" -eq 0 ]; then
            echo "无法访问产物服务，等待 15 秒后继续"
            sleep 15
            exit 0
          fi
          echo "等待产物 $name 超时"
          exit 1

      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
