name: 部署站点

# Pages 已切换为 Actions 部署，代码改动推送到 main 后由本工作流发布。
# 定时任务自己提交的数据变更由 update-metro.yml 直接部署（机器人推送不会触发本工作流）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 收集站点文件
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude=./.git --exclude=./.github --exclude=./timetable -cf - . | tar -xf - -C "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
          # 每次尝试用不同产物名：重跑（attempt>=2）时，旧的同名产物不会导致部署失败
          name: github-pages-${{ github.run_attempt }}

      # GitHub 的产物元数据接口有延迟：刚上传完立刻查询可能返回 0 个产物，deploy-pages 会因此失败。
      # 这里轮询等待产物可见（最多约 90 秒）。
      - name: 等待 Pages 产物可查询
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="github-pages-${{ github.run_attempt }}"
          for i in $(seq 1 45); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=$name" --jq '.artifacts | length' 2>/dev/null || echo 0)
            if [ "$n" -gt 0 ]; then
              echo "产物 $name 已可见（第 $i 次查询）"
              exit 0
            fi
            sleep 2
          done
          echo "等待产物 $name 超时"; exit 1

      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
