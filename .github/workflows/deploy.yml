name: 部署站点

# Pages 已切换为 Actions 部署，代码改动推送到 main 后由本工作流发布。
# 定时任务自己提交的数据变更由 update-metro.yml 直接部署（机器人推送不会触发本工作流）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 收集站点文件
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude=./.git --exclude=./.github --exclude=./timetable -cf - . | tar -xf - -C "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
          # 每次尝试用不同产物名：重跑（attempt>=2）时，旧的同名产物不会导致部署失败
          name: github-pages-${{ github.run_attempt }}

      # GitHub 的产物元数据接口有延迟：deploy-pages 查询产物时偶尔返回 0 个
      # （2026-11-23、11-24、11-25 的部署失败均为此原因）。先等 REST 接口可见，
      # 再留出同步时间；若部署仍失败，等待后重试一次。
      - name: 等待 Pages 产物可查询
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="github-pages-${{ github.run_attempt }}"
          for i in $(seq 1 45); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=$name" --jq '.artifacts | length' 2>/dev/null || echo 0)
            if [ "$n" -gt 0 ]; then
              echo "产物 $name 已可见（第 $i 次查询）"
              break
            fi
            sleep 2
          done
          sleep 20

      - uses: actions/deploy-pages@v4
        id: pages-deploy-1
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: 部署失败时等待产物服务同步
        if: steps.pages-deploy-1.outcome == 'failure'
        run: sleep 60

      - uses: actions/deploy-pages@v4
        if: steps.pages-deploy-1.outcome == 'failure'
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
