name: 每日更新全国铁路时刻表

# 北京时间每天 12:00 = UTC 04:00
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  # 修改本文件时自动试跑一次，便于验证工作流改动
  push:
    paths:
      - '.github/workflows/update-transfer.yml'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查版本并下载最新数据
        run: node tools/update-lltskb-data.mjs

      - name: 数据自检
        run: node tools/verify-transfer-data.mjs

      - name: 提交数据变更
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transfer/data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "自动更新全国铁路时刻表数据 $(date +%F)"
            git pull --rebase --autostash origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # 与「部署站点」「每周更新苏州地铁时刻表」共用同一个部署组，避免多个工作流同时发布 Pages
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 收集站点文件
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude=./.git --exclude=./.github --exclude=./timetable -cf - . | tar -xf - -C "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
          # 每次尝试用不同产物名：重跑（attempt>=2）时，旧的同名产物不会导致部署失败
          name: github-pages-${{ github.run_attempt }}

      # GitHub 的产物元数据接口有延迟：deploy-pages 查询产物时偶尔返回 0 个
      # （2026-11-23、11-24、11-25 的部署失败均为此原因）。先等 REST 接口可见，
      # 再留出同步时间；若部署仍失败，等待后重试一次。
      - name: 等待 Pages 产物可查询
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="github-pages-${{ github.run_attempt }}"
          for i in $(seq 1 45); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=$name" --jq '.artifacts | length' 2>/dev/null || echo 0)
            if [ "$n" -gt 0 ]; then
              echo "产物 $name 已可见（第 $i 次查询）"
              break
            fi
            sleep 2
          done
          sleep 20

      - uses: actions/deploy-pages@v4
        id: pages-deploy-1
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: 部署失败时等待产物服务同步
        if: steps.pages-deploy-1.outcome == 'failure'
        run: sleep 60

      - uses: actions/deploy-pages@v4
        if: steps.pages-deploy-1.outcome == 'failure'
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
