name: 每日更新全国铁路时刻表

# 北京时间每天 12:00 = UTC 04:00
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  # 修改本文件时自动试跑一次，便于验证工作流改动
  push:
    paths:
      - '.github/workflows/update-transfer.yml'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查版本并下载最新数据
        run: node tools/update-lltskb-data.mjs

      - name: 数据自检
        run: node tools/verify-transfer-data.mjs

      - name: 提交数据变更
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transfer/data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "自动更新全国铁路时刻表数据 $(date +%F)"
            git pull --rebase --autostash origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # 与「部署站点」「每周更新苏州地铁时刻表」共用同一个部署组，避免多个工作流同时发布 Pages
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 收集站点文件
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude=./.git --exclude=./.github --exclude=./timetable -cf - . | tar -xf - -C "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
          # 每次尝试用不同产物名：重跑（attempt>=2）时，旧的同名产物不会导致部署失败
          name: github-pages-${{ github.run_attempt }}

      # GitHub 的产物元数据接口有延迟：deploy-pages 通过 Actions 产物服务（Twirp）查询，
      # 刚上传完立刻查询可能返回 0 个产物，导致部署失败。这里先轮询 REST 接口，
      # 再轮询 deploy-pages 实际使用的产物服务，等产物真正可见后再部署。
      - name: 等待 Pages 产物可查询
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="github-pages-${{ github.run_attempt }}"
          for i in $(seq 1 45); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=$name" --jq '.artifacts | length' 2>/dev/null || echo 0)
            if [ "$n" -gt 0 ]; then
              echo "REST: 产物 $name 已可见（第 $i 次查询）"
              break
            fi
            sleep 2
          done
          ok=0
          for i in $(seq 1 30); do
            body=$(curl -sS --max-time 5 -X POST "$ACTIONS_RESULTS_URL/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts" -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" -H 'Content-Type: application/json' -d '{}' 2>/dev/null || true)
            if [ -n "$body" ]; then
              ok=1
              n=$(printf '%s' "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for a in d.get('artifacts',[]) if a.get('name')==sys.argv[1]))" "$name" 2>/dev/null || echo 0)
              if [ "${n:-0}" -gt 0 ]; then
                echo "产物服务: $name 已可见（第 $i 次查询）"
                exit 0
              fi
            fi
            sleep 2
          done
          if [ "$ok" -eq 0 ]; then
            echo "无法访问产物服务，等待 15 秒后继续"
            sleep 15
            exit 0
          fi
          echo "等待产物 $name 超时"
          exit 1

      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
