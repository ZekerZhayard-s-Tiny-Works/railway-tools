name: 每周更新苏州地铁时刻表

# 北京时间每周一 08:00 = UTC 周一 00:00
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-metro
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 编译抓取程序
        run: javac -encoding UTF-8 -d timetable/temp/classes timetable/src/szmetro/*.java

      - name: 抓取全部星期的时刻表
        working-directory: timetable
        timeout-minutes: 150
        run: java -cp temp/classes szmetro.Main crawl --all-weekdays --refresh

      - name: 重建站点数据并校验完整性
        run: node tools/build-metro-data.mjs --min-stops 264 --min-departures 80000

      - name: 与 Java 版对拍
        run: node tools/verify-metro.mjs

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metro/data
          if git diff --cached --quiet; then
            echo "时刻表无变化，跳过提交"
          else
            git commit -m "自动更新苏州地铁时刻表 $(date +%F)"
            git push
          fi

      - name: 收集站点文件
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude=./.git --exclude=./.github --exclude=./timetable -cf - . | tar -xf - -C "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v4
