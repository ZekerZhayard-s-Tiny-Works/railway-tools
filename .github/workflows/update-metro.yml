name: 每周更新苏州地铁时刻表

# 北京时间每周一 08:00 = UTC 周一 00:00
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  # 修改本文件时自动试跑一次，便于验证工作流改动
  push:
    paths:
      - '.github/workflows/update-metro.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-metro
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 检查数据源连通性
        run: |
          curl -sS -o /dev/null -w "时刻表站点: HTTP %{http_code}，耗时 %{time_total}s\n" --max-time 60 http://106.14.198.252:8512/station
          # 官网站对时间对境外 IP 返回 403，属预期情况；CI 使用仓库内快照，见下方步骤
          curl -sS -o /dev/null -w "官网线路图: HTTP %{http_code}（403 属预期）\n" --max-time 60 https://www.sz-mtr.com/service/guide/map/index_zh.html

      - name: 编译抓取程序
        run: javac -encoding UTF-8 -d timetable/temp/classes timetable/src/szmetro/*.java

      - name: 预置官网站对时间快照
        run: |
          mkdir -p timetable/temp/cache
          cp timetable/official/official_lines.txt timetable/official/official_pairs.txt timetable/temp/cache/

      - name: 抓取全部星期的时刻表
        working-directory: timetable
        timeout-minutes: 150
        # 不传 --refresh：官网站对文件已预置，抓取程序会直接复用，只重新抓时刻表
        run: java -cp temp/classes szmetro.Main crawl --all-weekdays

      - name: 重建站点数据并校验完整性
        run: node tools/build-metro-data.mjs --min-stops 264 --min-departures 80000

      - name: 与 Java 版对拍
        run: node tools/verify-metro.mjs

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metro/data
          if git diff --cached --quiet; then
            echo "时刻表无变化，跳过提交"
          else
            git commit -m "自动更新苏州地铁时刻表 $(date +%F)"
            # 抓取耗时较长，期间若有人推送过，先 rebase 再推，避免非快进失败
            git pull --rebase --autostash origin main
            git push
          fi

      - name: 收集站点文件
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude=./.git --exclude=./.github --exclude=./timetable -cf - . | tar -xf - -C "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v4
